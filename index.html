<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retour d’activités – BTS ATI 26-28</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F2F4F8; --surface:#FFFFFF; --ink:#0F1B2E; --ink2:#46536A; --line:#CFD7E3;
  --blue:#1F4FA8; --blue-ink:#FFFFFF; --blue-soft:#E3EBF9; --mark:#F2C230; --mark-ink:#1B1600;
  --warn:#9A4008;
  --acq:#17734A; --acq-soft:#DDF1E6; --acq-mid:#A9D9BF;
  --cour:#A8570A; --cour-soft:#FDE9CF; --cour-mid:#F4C894;
  --non:#B3261E; --non-soft:#FADBD8; --non-mid:#EFAFA9;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1420; --surface:#152033; --ink:#EAF0F8; --ink2:#A7B3C6; --line:#2B3B56;
    --blue:#7FA8F2; --blue-ink:#0D1420; --blue-soft:#1B2D4F; --warn:#F0A36B;
    --acq:#5FD39B; --acq-soft:#153427; --acq-mid:#24563F;
    --cour:#F5A94B; --cour-soft:#3A2A12; --cour-mid:#6A4A1C;
    --non:#FF8F86; --non-soft:#40201D; --non-mid:#6E3330;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1420; --surface:#152033; --ink:#EAF0F8; --ink2:#A7B3C6; --line:#2B3B56;
  --blue:#7FA8F2; --blue-ink:#0D1420; --blue-soft:#1B2D4F; --warn:#F0A36B;
  --acq:#5FD39B; --acq-soft:#153427; --acq-mid:#24563F;
  --cour:#F5A94B; --cour-soft:#3A2A12; --cour-mid:#6A4A1C;
  --non:#FF8F86; --non-soft:#40201D; --non-mid:#6E3330;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- En-tête ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1480px;margin:0 auto;padding:26px clamp(16px,4vw,48px) 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 32px;align-items:end}
.kicker{font-weight:600;color:var(--blue);font-size:15px;margin:0 0 2px}
h1{font:700 clamp(27px,3.6vw,36px)/1.12 var(--serif);margin:0;letter-spacing:-.01em}
.subtitle{margin:6px 0 0;color:var(--ink2);font-size:16px}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:7px;border:1.5px solid var(--blue);background:var(--blue);color:var(--blue-ink);font-weight:600;font-size:14.5px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.quiet:hover{border-color:var(--blue)}
.btn.danger{background:transparent;border-color:var(--line);color:var(--warn)}
.btn.armed{background:var(--non);border-color:var(--non);color:#fff}

.cartouche{max-width:1480px;margin:0 auto;padding:0 clamp(16px,4vw,48px) 22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cartouche label{font-size:13px;font-weight:600;color:var(--ink2);display:block;margin-bottom:3px}

input[type=text],input[type=number],textarea,select{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);line-height:1.45}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus,select:focus{outline:3px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
::placeholder{color:var(--ink2);opacity:.7}

/* ---------- Disposition ---------- */
.layout{max-width:1480px;margin:0 auto;padding:26px clamp(16px,4vw,48px) 80px;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:28px;align-items:start}
.colhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 14px}
h2{font:700 22px/1.2 var(--serif);margin:0}
.meta{color:var(--ink2);font-size:14px}

/* ---------- Tâches ---------- */
.task{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:8px;padding:16px 20px 18px;margin-bottom:18px}
.task-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.task-h h3{font:700 18px/1.2 var(--serif);margin:0}
.task-tools{display:flex;gap:4px;align-items:center}
.icon{width:32px;height:32px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.icon:hover:not(:disabled){border-color:var(--blue)}
.icon:disabled{opacity:.35;cursor:default}
.icon svg{width:15px;height:15px}
.linkbtn{background:none;border:0;padding:5px 6px;color:var(--warn);font-weight:600;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fld label{display:block;font-weight:600;font-size:14.5px;margin-bottom:4px}
.hours{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:600;font-size:14.5px}
.hours input{width:96px}

.comps{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.comps-h{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-bottom:8px}
.comps-h h4{margin:0;font-size:15px;font-weight:700}
.comps-h span{font-size:13px;color:var(--ink2)}
.empty-c{font-size:14px;color:var(--ink2);margin:0 0 8px}

.comp{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,250px) 136px 32px;gap:6px 16px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-left:7px solid var(--c);border-radius:7px;margin-bottom:8px;background:var(--surface)}
.comp[data-lvl="0"]{--c:var(--non);--cs:var(--non-soft)}
.comp[data-lvl="1"]{--c:var(--cour);--cs:var(--cour-soft)}
.comp[data-lvl="2"]{--c:var(--acq);--cs:var(--acq-soft)}
.comp-name{min-width:0;font-size:14.5px;line-height:1.35}
.comp-name b{color:var(--blue);margin-right:8px}
.state{display:inline-block;justify-self:start;padding:3px 10px;border-radius:99px;background:var(--cs);color:var(--c);font-weight:700;font-size:13px;white-space:nowrap}

/* Curseur à trois positions */
.lift{min-width:0}
.lift input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0;cursor:pointer;display:block}
.lift input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:var(--track)}
.lift input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:var(--track)}
.lift input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:var(--surface);border:5px solid var(--c);margin-top:-7px;box-shadow:0 1px 3px rgba(0,0,0,.28)}
.lift input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--surface);border:5px solid var(--c);box-shadow:0 1px 3px rgba(0,0,0,.28)}
.comp[data-lvl="0"] .lift{--track:linear-gradient(90deg,var(--non) 0 25%,var(--cour-mid) 25% 75%,var(--acq-mid) 75%)}
.comp[data-lvl="1"] .lift{--track:linear-gradient(90deg,var(--non-mid) 0 25%,var(--cour) 25% 75%,var(--acq-mid) 75%)}
.comp[data-lvl="2"] .lift{--track:linear-gradient(90deg,var(--non-mid) 0 25%,var(--cour-mid) 25% 75%,var(--acq) 75%)}
.ticks{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:12px;color:var(--ink2);margin-top:1px}
.ticks button{background:none;border:0;padding:2px 0;cursor:pointer;color:inherit;font-size:12px}
.ticks button:nth-child(1){text-align:left}
.ticks button:nth-child(3){text-align:right}
.ticks button.on{color:var(--c);font-weight:700}
.x{width:32px;height:32px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1}
.x:hover{background:var(--non-soft);color:var(--non)}

.add{display:flex;gap:8px;align-items:center;margin-top:4px}
.add select{max-width:560px}
.addtask{width:100%;justify-content:center;padding:14px;border-style:dashed;font-size:15.5px}

/* ---------- Cartographie ---------- */
.map{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);max-height:calc(100dvh - 28px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 18px 8px}
.mode{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 4px;font-size:13.5px}
.mode span{color:var(--ink2);margin-right:2px}
.seg{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:13px;cursor:pointer;font-weight:500}
.seg[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.radar{width:100%;height:auto;display:block;margin:4px 0}
.radar text{font-family:var(--sans)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;list-style:none;padding:0;margin:0 0 14px;font-size:13.5px}
.legend li{display:flex;align-items:center;gap:8px}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.sw{width:13px;height:13px;border-radius:3px;background:var(--c);flex:none}
.l-acq{--c:var(--acq)} .l-cour{--c:var(--cour)} .l-non{--c:var(--non)} .l-nm{--c:var(--line)}
h3.lt{font:700 17px/1.2 var(--serif);margin:16px 0 8px}
.clist{list-style:none;margin:0;padding:0}
.clist li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 10px;padding:9px 2px;border-top:1px solid var(--line);font-size:14px;line-height:1.35}
.clist .cd{font-weight:700;color:var(--blue)}
.clist .lb{min-width:0}
.clist .sub{grid-column:2/4;font-size:12.5px;color:var(--ink2)}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;align-self:start;background:var(--cs);color:var(--c)}
.p0{--c:var(--non);--cs:var(--non-soft)} .p1{--c:var(--cour);--cs:var(--cour-soft)} .p2{--c:var(--acq);--cs:var(--acq-soft)}
.pn{background:transparent;color:var(--ink2);border:1px dashed var(--line);font-weight:500}
.trail{display:inline-flex;gap:3px;vertical-align:-1px;margin-left:6px}
.trail i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.t0{--c:var(--non)} .t1{--c:var(--cour)} .t2{--c:var(--acq)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:8px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

.proofs{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.drop{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:2px dashed var(--line);border-radius:8px;padding:12px 16px;color:var(--ink2);font-size:14px;background:var(--paper)}
.drop.over{border-color:var(--blue);background:var(--blue-soft);color:var(--ink)}
.drop .btn{padding:7px 13px;font-size:14px}
.plist{display:grid;gap:10px;margin-top:10px}
.proof{display:grid;grid-template-columns:84px minmax(0,1fr) 32px;gap:12px;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.thumb{width:84px;height:84px;border-radius:6px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;overflow:hidden;padding:0;font-weight:700;font-size:13px;color:var(--blue)}
button.thumb{cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pname{font-weight:600;font-size:14.5px;overflow-wrap:anywhere;margin:0}
.pmeta{font-size:12.5px;color:var(--ink2);margin:0 0 6px}
.prow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px}
.prow>span,.prow em{color:var(--ink2)}
.pc{border:1.5px dashed var(--line);background:none;border-radius:99px;padding:2px 9px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.pc[aria-pressed="true"]{border-style:solid;border-color:var(--c);background:var(--cs);color:var(--c);font-weight:700}
.pfields{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;margin-top:8px}
.pfields input{padding:6px 9px;font-size:14px}
.noproof{color:var(--warn)}
.proofnote{font-size:13px;color:var(--ink2);margin:-6px 0 14px}
dialog.viewer{border:0;padding:0;background:transparent;max-width:94vw;max-height:94vh}
dialog.viewer::backdrop{background:rgba(5,10,20,.82)}
dialog.viewer img{max-width:94vw;max-height:84vh;display:block;border-radius:6px;margin:auto}
dialog.viewer .vbar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 2px;color:#fff;font-size:14px}
dialog.viewer .vbar button{background:#fff;color:#0F1B2E;border:0;border-radius:6px;padding:6px 12px;font-weight:600;cursor:pointer}
@media (max-width:860px){.proof{grid-template-columns:64px minmax(0,1fr) 32px}.thumb{width:64px;height:64px}.pfields{grid-template-columns:1fr}}

@media (max-width:1180px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .map{position:static;max-height:none}
  .radar{max-width:560px;margin:4px auto}
}
@media (max-width:860px){
  .top-in{grid-template-columns:1fr}
  .tools{justify-content:flex-start}
  .cartouche{grid-template-columns:1fr 1fr}
  .fields{grid-template-columns:1fr}
  .comp{grid-template-columns:minmax(0,1fr) 32px}
  .comp .lift{grid-column:1/-1;grid-row:2}
  .comp .state{grid-row:3}
  .comp .x{grid-column:2;grid-row:1}
}
@media (max-width:480px){.cartouche{grid-template-columns:1fr}.legend{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div>
      <p class="kicker">BTS ATI 26-28, apprentissage</p>
      <h1>Retour d’activités</h1>
      <p class="subtitle">Tâches confiées, et compétences associées</p>
    </div>
    <div class="tools">
      <button class="btn quiet" id="bExample" type="button">Voir un exemple</button>
      <button class="btn quiet" id="bLoad" type="button">Reprendre une sauvegarde</button>
      <button class="btn ghost" id="bSave" type="button">Sauvegarder (.json)</button>
      <button class="btn" id="bWord" type="button">Exporter le document Word</button>
      <button class="btn" id="bZip" type="button">Exporter avec les pièces (.zip)</button>
      <button class="btn danger" id="bClear" type="button">Tout effacer</button>
      <input type="file" id="fileIn" accept="application/json,.json" hidden>
    </div>
  </div>
  <div class="cartouche">
    <div><label for="i-apprenti">Apprenti</label><input type="text" id="i-apprenti" data-i="apprenti" placeholder="Nom et prénom"></div>
    <div><label for="i-entreprise">Entreprise</label><input type="text" id="i-entreprise" data-i="entreprise" placeholder="Raison sociale"></div>
    <div><label for="i-tuteur">Maître d’apprentissage</label><input type="text" id="i-tuteur" data-i="tuteur" placeholder="Nom du tuteur"></div>
    <div><label for="i-periode">Période en entreprise</label><input type="text" id="i-periode" data-i="periode" placeholder="Ex. : du 2 au 27 mars 2026"></div>
  </div>
</header>

<div class="layout">
  <main>
    <div class="colhead">
      <h2>Tâches confiées</h2>
      <span class="meta" id="tmeta"></span>
    </div>
    <div id="tasks"></div>
    <button class="btn ghost addtask" id="bAdd" type="button">+ Ajouter une tâche</button>
  </main>

  <aside class="map" aria-labelledby="mapTitle">
    <h2 id="mapTitle">Cartographie des compétences</h2>
    <div class="mode" role="group" aria-label="Mode de calcul de l’état de chaque compétence">
      <span>État retenu :</span>
      <button class="seg" type="button" data-mode="last" title="État indiqué dans la tâche la plus récente qui mobilise la compétence">dernière tâche</button>
      <button class="seg" type="button" data-mode="avg" title="Moyenne des états sur toutes les tâches">moyenne</button>
      <button class="seg" type="button" data-mode="best" title="Meilleur état atteint sur une tâche">meilleur niveau</button>
    </div>
    <svg class="radar" id="radar" viewBox="0 0 560 520" role="img" aria-label="Toile d’araignée de l’acquisition des compétences"></svg>
    <ul class="legend" id="legend"></ul>
    <p class="proofnote" id="proofnote"></p>
    <h3 class="lt">Liste des compétences</h3>
    <ul class="clist" id="clist"></ul>
  </aside>
</div>

<dialog class="viewer" id="viewer" aria-label="Aperçu de la pièce justificative"><div class="vbar"><span id="vname"></span><button type="button" id="vclose">Fermer</button></div><img id="vimg" alt=""></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* Référentiel repris du dossier de validation U7 */
const COMPS = [
  ['C1.1','Rechercher et trier des informations pour mettre à jour une bibliothèque ou une base de données'],
  ['C1.2','Participer à la veille technologique'],
  ['C1.3','Présenter oralement un document'],
  ['C1.4','Dialoguer avec les clients, les fournisseurs, les utilisateurs, le personnel'],
  ['C2','Analyser un document technique, une solution technique, une norme, un protocole d’essais'],
  ['C3.2','Modifier un poste de travail, un site de production'],
  ['C5.1','Établir et rédiger un cahier des charges fonctionnel'],
  ['C5.2','Établir et rédiger une notice technique'],
  ['C5.3','Préparer un dossier d’homologation ou de dépôt de brevet'],
  ['C5.4','Établir et rédiger un devis'],
  ['C5.5','Établir et rédiger un compte-rendu de réunion'],
  ['C6.1','Organiser, suivre un projet'],
  ['C6.2','Organiser, suivre la qualité'],
  ['C6.3','Organiser, suivre la maintenance'],
  ['C6.4','Organiser, suivre la sécurité'],
  ['C6.5','Organiser, gérer et suivre une production'],
  ['C8.1','Préparer une séance de travail'],
  ['C8.2','Conseiller, assister, former le personnel']
];
const LABEL = Object.fromEntries(COMPS);
const LV = [
  {name:'Non acquise', tick:'Non acquise', code:'na',  color:'B3261E', fill:'FADBD8'},
  {name:'En cours',    tick:'En cours',    code:'ecv', color:'A8570A', fill:'FDE9CF'},
  {name:'Acquise',     tick:'Acquise',     code:'v',   color:'17734A', fill:'DDF1E6'}
];

const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function newTask(){ return {id:uid(), desc:'', prod:'', meth:'', heures:'', comps:[], proofs:[]}; }

/* ---------- Stockage local des pièces (IndexedDB, sur l'appareil de l'apprenti) ---------- */
const MAX_FILE = 20*1024*1024;
const mem = new Map();          /* repli si IndexedDB est indisponible */
const urlCache = new Map();     /* id -> data URL pour les aperçus */
let idbP = null, idbWarned = false;
function idb(){
  if (!idbP) idbP = new Promise((res,rej)=>{
    try { const r = indexedDB.open('retour-bts-ati-pieces',1);
      r.onupgradeneeded = ()=> r.result.createObjectStore('files');
      r.onsuccess = ()=> res(r.result); r.onerror = ()=> rej(r.error);
    } catch(e){ rej(e); }
  });
  return idbP;
}
function idbDo(mode, fn){
  return idb().then(d=>new Promise((res,rej)=>{
    const tx = d.transaction('files', mode); const req = fn(tx.objectStore('files'));
    tx.oncomplete = ()=> res(req ? req.result : undefined); tx.onerror = ()=> rej(tx.error); tx.onabort = ()=> rej(tx.error);
  }));
}
async function putBlob(id, blob){
  mem.set(id, blob);
  try { await idbDo('readwrite', s=>s.put(blob, id)); }
  catch(e){ if (!idbWarned){ idbWarned = true; toast('Ce navigateur ne garde pas les fichiers : sauvegarde en .json avant de fermer la page.'); } }
}
async function getBlob(id){
  if (mem.has(id)) return mem.get(id);
  try { const b = await idbDo('readonly', s=>s.get(id)); if (b) mem.set(id,b); return b || null; } catch(e){ return null; }
}
async function delBlob(id){ mem.delete(id); urlCache.delete(id); try { await idbDo('readwrite', s=>s.delete(id)); } catch(e){} }
function dropProofs(tasks){ tasks.forEach(t=>(t.proofs||[]).forEach(p=>delBlob(p.id))); }
const readDataURL = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); });
function dataURLtoBlob(d){
  const [head, b64] = d.split(','); const type = (head.match(/data:([^;]+)/)||[])[1] || 'application/octet-stream';
  const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return new Blob([u], {type});
}
async function getURL(id){
  if (urlCache.has(id)) return urlCache.get(id);
  const b = await getBlob(id); if (!b) return null;
  const u = await readDataURL(b); urlCache.set(id,u); return u;
}
const today = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fmtSize = n => n<1024 ? n+' o' : n<1048576 ? Math.round(n/1024)+' ko' : (n/1048576).toFixed(1).replace('.',',')+' Mo';
const fmtDate = s => { if(!s) return ''; const d=new Date(s.length===10? s+'T12:00':s); return isNaN(d)? s : d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}); };
function blank(){ return {ident:{apprenti:'',entreprise:'',tuteur:'',periode:''}, tasks:[newTask()], mode:'last'}; }
function valid(s){ return s && typeof s==='object' && Array.isArray(s.tasks) && s.ident; }

let state;
try { const raw = localStorage.getItem(KEY); state = raw ? JSON.parse(raw) : null; } catch(e){ state = null; }
if (!valid(state)) state = blank();
if (!state.tasks.length) state.tasks.push(newTask());
state.tasks.forEach(t=>{ t.proofs = t.proofs || []; });

let saveT;
function persist(){
  clearTimeout(saveT);
  saveT = setTimeout(()=>{ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }, 350);
}
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }

const ICON_UP = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>';
const ICON_DN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v10M3.5 8.5 8 13l4.5-4.5"/></svg>';

function field(t, key, label, ph){
  const id = `f-${t.id}-${key}`;
  return `<div class="fld"><label for="${id}">${label}</label><textarea id="${id}" data-f="${key}" rows="4" placeholder="${esc(ph)}">${esc(t[key])}</textarea></div>`;
}
function compRow(c){
  return `<div class="comp" data-code="${c.code}" data-lvl="${c.lvl}">
    <div class="comp-name"><b>${c.code}</b>${esc(LABEL[c.code])}</div>
    <div class="lift">
      <input type="range" min="0" max="2" step="1" value="${c.lvl}" aria-label="État d’acquisition de ${c.code}" aria-valuetext="${LV_LONG[c.lvl]}">
      <div class="ticks">${LV.map((l,i)=>`<button type="button" data-l="${i}" class="${i===c.lvl?'on':''}" tabindex="-1">${l.tick}</button>`).join('')}</div>
    </div>
    <span class="state">${LV[c.lvl].name} <small>(${LV[c.lvl].code})</small></span>
    <button type="button" class="x" data-act="rm" aria-label="Retirer ${c.code} de la tâche">×</button>
  </div>`;
}
function taskHTML(t, i, n){
  const used = new Set(t.comps.map(c=>c.code));
  const opts = COMPS.filter(([c])=>!used.has(c)).map(([c,l])=>`<option value="${c}">${c} – ${esc(l)}</option>`).join('');
  return `<article class="task" data-id="${t.id}">
    <div class="task-h">
      <h3>Tâche ${i+1}</h3>
      <div class="task-tools">
        <button type="button" class="icon" data-act="up" aria-label="Monter la tâche ${i+1}" ${i===0?'disabled':''}>${ICON_UP}</button>
        <button type="button" class="icon" data-act="down" aria-label="Descendre la tâche ${i+1}" ${i===n-1?'disabled':''}>${ICON_DN}</button>
        <button type="button" class="linkbtn" data-act="del">Supprimer</button>
      </div>
    </div>

/* ---------------- Synthèse ---------------- */
function aggregate(){
  const m = {};
  COMPS.forEach(([c])=> m[c] = {evals:[], tasks:[], hours:0, proofs:0});
  state.tasks.forEach(t=> (t.proofs||[]).forEach(p=> p.comps.forEach(c=>{ if (m[c.code]) m[c.code].proofs++; })));
  state.tasks.forEach((t,i)=> t.comps.forEach(c=>{
    const a = m[c.code]; if (!a) return;
    a.evals.push(c.lvl); a.tasks.push(i+1); a.hours += parseFloat(String(t.heures).replace(',','.'))||0;
  }));
  const mode = state.mode || 'last';
  for (const c in m){
    const a = m[c];
    if (!a.evals.length){ a.score = 0; a.lvl = null; continue; }
    let v;
    if (mode==='best') v = Math.max(...a.evals);
    else if (mode==='avg') v = a.evals.reduce((s,x)=>s+x,0)/a.evals.length;
    else v = a.evals[a.evals.length-1];
    a.score = v + 1;                      /* 1 à 3 sur la toile */
    a.lvl = v < 2/3 ? 0 : v < 4/3 ? 1 : 2;
  }
  return m;
}

const SVGNS = 'http://www.w3.org/2000/svg';
function renderMap(){
  const agg = aggregate();
  document.querySelectorAll('.seg').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.mode===(state.mode||'last'))));

  /* Toile d'araignée */
  const W=560, H=520, cx=W/2, cy=H/2+4, R=188, N=COMPS.length;
  const ang = i => -Math.PI/2 + i*2*Math.PI/N;
  const pt = (i,r) => [cx + r*Math.cos(ang(i)), cy + r*Math.sin(ang(i))];
  const ring = k => COMPS.map((_,i)=>pt(i,R*k/3).map(v=>v.toFixed(1)).join(',')).join(' ');
  let s = '';
  const bands = [['--acq-soft',3],['--cour-soft',2],['--non-soft',1]];
  bands.forEach(([v,k])=> s += `<polygon points="${ring(k)}" fill="var(${v})" stroke="var(--line)" stroke-width="1"/>`);
  COMPS.forEach((_,i)=>{ const [x,y]=pt(i,R); s += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`; });
  const poly = COMPS.map(([c],i)=>pt(i,R*agg[c].score/3).map(v=>v.toFixed(1)).join(',')).join(' ');
  s += `<polygon points="${poly}" fill="var(--blue)" fill-opacity=".18" stroke="var(--blue)" stroke-width="2.2" stroke-linejoin="round"/>`;
  const col = ['var(--non)','var(--cour)','var(--acq)'];
  COMPS.forEach(([c],i)=>{
    const a = agg[c];
    if (a.lvl!==null){ const [x,y]=pt(i,R*a.score/3); s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="${col[a.lvl]}" stroke="var(--surface)" stroke-width="2"><title>${c} : ${LV_LONG[a.lvl]}</title></circle>`; }
    const [lx,ly] = pt(i,R+24);
    const cos = Math.cos(ang(i));
    const anchor = Math.abs(cos)<.2 ? 'middle' : cos>0 ? 'start' : 'end';
    const fill = a.lvl===null ? 'var(--ink2)' : col[a.lvl];
    s += `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="13" font-weight="700" fill="${fill}"><title>${c} – ${esc(LABEL[c])}</title>${c}</text>`;
  });
  s += `<text x="${cx+4}" y="${(cy-R/3+14).toFixed(1)}" font-size="10.5" fill="var(--ink2)">non acquise</text>`;
  s += `<text x="${cx+4}" y="${(cy-2*R/3+14).toFixed(1)}" font-size="10.5" fill="var(--ink2)">en cours</text>`;
  s += `<text x="${cx+4}" y="${(cy-R+14).toFixed(1)}" font-size="10.5" fill="var(--ink2)">acquise</text>`;
  $('#radar').innerHTML = s;

  /* Légende avec effectifs */
  const cnt = [0,0,0,0];
  COMPS.forEach(([c])=>{ const l=agg[c].lvl; cnt[l===null?3:l]++; });
  $('#legend').innerHTML =
    `<li class="l-acq"><i class="sw"></i>Pleinement acquises<b>${cnt[2]}</b></li>
     <li class="l-cour"><i class="sw"></i>En cours d’acquisition<b>${cnt[1]}</b></li>
     <li class="l-non"><i class="sw"></i>Non acquises<b>${cnt[0]}</b></li>
     <li class="l-nm"><i class="sw"></i>Pas encore mobilisées<b>${cnt[3]}</b></li>`;

  const nop = COMPS.filter(([c])=>agg[c].lvl!==null && !agg[c].proofs).length;
  const np = state.tasks.reduce((s,t)=>s+t.proofs.length,0);
  $('#proofnote').innerHTML = `${np} pièce${np>1?'s':''} justificative${np>1?'s':''} déposée${np>1?'s':''}` + (nop ? `, <span class="noproof">${nop} compétence${nop>1?'s':''} mobilisée${nop>1?'s':''} sans preuve</span>` : '') + '.';
  /* Liste */
  $('#clist').innerHTML = COMPS.map(([c,l])=>{
    const a = agg[c];
    const pill = a.lvl===null ? '<span class="pill pn">Non mobilisée</span>' : `<span class="pill p${a.lvl}">${LV[a.lvl].name}</span>`;
    const sub = a.lvl===null ? 'Aucune tâche ne la mobilise encore.'
      : `Tâche${a.tasks.length>1?'s':''} ${a.tasks.join(', ')} (${fmtH(a.hours)})<span class="trail" aria-label="Évolution : ${a.evals.map(v=>LV_LONG[v]).join(', puis ')}">${a.evals.map(v=>`<i class="t${v}"></i>`).join('')}</span><br>${a.proofs ? `${a.proofs} pièce${a.proofs>1?'s':''} justificative${a.proofs>1?'s':''}` : '<span class="noproof">Sans pièce justificative</span>'}`;
    return `<li><span class="cd">${c}</span><span class="lb">${esc(l)}</span>${pill}<span class="sub">${sub}</span></li>`;
  }).join('');
}

const x = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function wRun(text, o={}){
  const rpr = `<w:rPr>${o.bold?'<w:b/>':''}${o.color?`<w:color w:val="${o.color}"/>`:''}<w:sz w:val="${o.size||22}"/><w:szCs w:val="${o.size||22}"/></w:rPr>`;
  return String(text).split('\n').map((l,i)=>(i?`<w:r>${rpr}<w:br/></w:r>`:'')+`<w:r>${rpr}<w:t xml:space="preserve">${x(l)}</w:t></w:r>`).join('');
}
function wPara(runs, o={}){
  return `<w:p><w:pPr><w:pStyle w:val="${o.style||'TableParagraph'}"/><w:spacing w:before="${o.before??40}" w:after="${o.after??40}"/><w:ind w:left="${o.ind??80}" w:right="80"/>${o.center?'<w:jc w:val="center"/>':''}</w:pPr>${runs}</w:p>`;
}
function wCell(w, paras, fill){
  return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${fill?`<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>`:''}</w:tcPr>${paras || wPara('')}</w:tc>`;
}
const BORDERS = '<w:tblBorders>'+['top','left','bottom','right','insideH','insideV'].map(b=>`<w:${b} w:val="single" w:color="000000" w:sz="4" w:space="0"/>`).join('')+'</w:tblBorders>';

async function toJpeg(blob){
  try {
    const src = await readDataURL(blob);
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
    const k = Math.min(1, 1600/Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1,Math.round(img.naturalWidth*k)), h = Math.max(1,Math.round(img.naturalHeight*k));
    const c = document.createElement('canvas'); c.width=w; c.height=h;
    const g = c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(img,0,0,w,h);
    const out = await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
    return out ? {blob:out, w, h} : null;
  } catch(e){ return null; }
}
function wDrawing(rid, n, name, w, h){
  const maxW = 6.5*914400, maxH = 4.6*914400;
  const k = Math.min(maxW/w, maxH/h); const cx = Math.round(w*k), cy = Math.round(h*k);
  return `<w:p><w:pPr><w:spacing w:before="40" w:after="200"/><w:ind w:left="127"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${1000+n}" name="Pièce ${n}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${1000+n}" name="${x(name)}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
}
async function exportWord(){
  const blob = await buildDocx(); if (blob) await saveFile(baseName()+'.docx', blob);
}
async function buildDocx(){
  if (typeof JSZip === 'undefined'){ toast('Le module d’export n’a pas pu se charger. Recharge la page.'); return null; }
  try {
    const bytes = Uint8Array.from(atob(TPL_B64), c=>c.charCodeAt(0));
    const zip = await JSZip.loadAsync(bytes);
    let xml = await zip.file('word/document.xml').async('string');

    /* 1. Lignes du tableau : une ligne par tâche, même grille que le document */
    const W = [4606,3687,2835,1844,1417];
    const rows = state.tasks.map(t=>{
      const comps = t.comps.length
        ? t.comps.map(c=>wPara(wRun(c.code,{bold:true})+wRun(` (${LV[c.lvl].code})`,{bold:true,color:LV[c.lvl].color}))).join('')
        : wPara('');
      const h = t.heures ? String(t.heures).replace('.',',')+' h' : '';
      return `<w:tr><w:trPr><w:trHeight w:val="827"/></w:trPr>${
        wCell(W[0], wPara(wRun(t.desc)))+wCell(W[1], wPara(wRun(t.prod)))+wCell(W[2], wPara(wRun(t.meth)))+
        wCell(W[3], comps)+wCell(W[4], wPara(wRun(h),{center:true}))}</w:tr>`;
    }).join('');
    const tblStart = xml.indexOf('<w:tbl>');
    const headEnd = xml.indexOf('</w:tr>', tblStart) + '</w:tr>'.length;
    const tblEnd = xml.indexOf('</w:tbl>', headEnd);
    const totalH = state.tasks.reduce((s,t)=>s+(parseFloat(String(t.heures).replace(',','.'))||0),0);

    /* 2. Légende, puis cartographie des compétences sur une nouvelle page */
    const agg = aggregate();
    const modeTxt = {last:'état de la dernière tâche', avg:'moyenne des tâches', best:'meilleur niveau atteint'}[state.mode||'last'];
    const CW = [1000,5900,2300,1300,2400,1730];
    const head = `<w:tr><w:trPr><w:tblHeader/></w:trPr>${['Code','Compétence','État d’acquisition','Tâches','Temps des tâches associées','Pièces justificatives'].map((h,i)=>wCell(CW[i], wPara(wRun(h,{bold:true})), 'E3EBF9')).join('')}</w:tr>`;
    const crow = COMPS.map(([c,l])=>{
      const a = agg[c];
      const st = a.lvl===null ? wPara(wRun('Non mobilisée',{color:'46536A'})) : wPara(wRun(`${LV_LONG[a.lvl]} (${LV[a.lvl].code})`,{bold:true,color:LV[a.lvl].color}));
      return `<w:tr>${wCell(CW[0], wPara(wRun(c,{bold:true})))}${wCell(CW[1], wPara(wRun(l)))}${wCell(CW[2], st, a.lvl===null?null:LV[a.lvl].fill)}${wCell(CW[3], wPara(wRun(a.tasks.join(', '))))}${wCell(CW[4], wPara(wRun(a.lvl===null?'':fmtH(a.hours))))}${wCell(CW[5], wPara(wRun(a.lvl===null?'':String(a.proofs),{color:a.lvl!==null&&!a.proofs?'9A4008':null,bold:a.lvl!==null&&!a.proofs})))}</w:tr>`;
    }).join('');
    const cnt=[0,0,0,0]; COMPS.forEach(([c])=>{ const l=agg[c].lvl; cnt[l===null?3:l]++; });
    const after =
      wPara(wRun(`Total estimé : ${fmtH(totalH)}.   v : compétence validée ; ecv : en cours de validation ; na : non acquise.`,{size:20}),{style:'Corpsdetexte',before:120,ind:127}) +
      `<w:p><w:r><w:br w:type="page"/></w:r></w:p>` +
      wPara(wRun('Cartographie des compétences',{bold:true,size:32}),{style:'Corpsdetexte',before:0,after:80,ind:127}) +
      wPara(wRun(`Pleinement acquises : ${cnt[2]}   En cours d’acquisition : ${cnt[1]}   Non acquises : ${cnt[0]}   Non mobilisées : ${cnt[3]}   (état retenu : ${modeTxt})`,{size:20}),{style:'Corpsdetexte',after:160,ind:127}) +
      `<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblInd w:w="127" w:type="dxa"/>${BORDERS}<w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${CW.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${head}${crow}</w:tbl>`;

    /* 2 bis. Annexe : pièces justificatives (tableau + images intégrées) */
    const PW = [1000,3900,3300,1600,4830];
    const proofs = []; state.tasks.forEach((t,i)=>t.proofs.forEach(p=>proofs.push({t,i,p})));
    let annex = `<w:p><w:r><w:br w:type="page"/></w:r></w:p>` + wPara(wRun('Pièces justificatives',{bold:true,size:32}),{style:'Corpsdetexte',before:0,after:160,ind:127});
    if (!proofs.length) annex += wPara(wRun('Aucune pièce justificative jointe.',{size:20}),{style:'Corpsdetexte',ind:127});
    else {
      const ph = `<w:tr><w:trPr><w:tblHeader/></w:trPr>${['Tâche','Pièce','Compétences attestées (niveau)','Date de réalisation','Ce que montre la pièce'].map((h,k)=>wCell(PW[k], wPara(wRun(h,{bold:true})), 'E3EBF9')).join('')}</w:tr>`;
      const pr = proofs.map(({i,p})=>`<w:tr>${wCell(PW[0], wPara(wRun(String(i+1)),{center:true}))}${wCell(PW[1], wPara(wRun(p.name)))}${wCell(PW[2], p.comps.length ? p.comps.map(c=>wPara(wRun(c.code,{bold:true})+wRun(` (${LV[c.lvl].code})`,{bold:true,color:LV[c.lvl].color}))).join('') : wPara(''))}${wCell(PW[3], wPara(wRun(p.date?fmtDate(p.date):'')))}${wCell(PW[4], wPara(wRun(p.note||'')))}</w:tr>`).join('');
      annex += `<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblInd w:w="127" w:type="dxa"/>${BORDERS}<w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${PW.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${ph}${pr}</w:tbl>`;
      let rels = await zip.file('word/_rels/document.xml.rels').async('string');
      let n = 0, figs = '';
      for (const {i,p} of proofs){
        if (!/^image\//.test(p.type||'')) continue;
        const b = await getBlob(p.id); if (!b) continue;
        const j = await toJpeg(b); if (!j) continue;
        n++; const rid = 'rIdPiece'+n;
        zip.file(`word/media/piece_${n}.jpg`, j.blob);
        rels = rels.replace('</Relationships>', `<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/piece_${n}.jpg"/></Relationships>`);
        figs += wPara(wRun(`Tâche ${i+1} : ${p.name}`,{bold:true,size:20})+(p.note?wRun(` – ${p.note}`,{size:20}):''),{style:'Corpsdetexte',before:200,after:40,ind:127}) + wDrawing(rid, n, p.name, j.w, j.h);
      }
      if (n){
        zip.file('word/_rels/document.xml.rels', rels);
        let ct = await zip.file('[Content_Types].xml').async('string');
        if (!/Extension="jpg"/i.test(ct)) ct = ct.replace('<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">', '$&<Default Extension="jpg" ContentType="image/jpeg"/>');
        zip.file('[Content_Types].xml', ct);
        annex += wPara(wRun('Images jointes',{bold:true,size:26}),{style:'Corpsdetexte',before:320,after:40,ind:127}) + figs;
      }
    }

    /* 3. Identification au-dessus du tableau */
    const id = state.ident;
    const idParts = [['Apprenti',id.apprenti],['Entreprise',id.entreprise],['Maître d’apprentissage',id.tuteur],['Période',id.periode]].filter(p=>p[1]);
    const idPara = idParts.length ? wPara(idParts.map(([k,v],i)=>(i?wRun('     '):'')+wRun(k+' : ',{bold:true})+wRun(v)).join(''),{style:'Corpsdetexte',after:160,ind:127}) : '';

    xml = xml.slice(0, tblStart) + idPara + xml.slice(tblStart, headEnd) + rows + '</w:tbl>' + after + annex + xml.slice(tblEnd + '</w:tbl>'.length);
    zip.file('word/document.xml', xml);
    return await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  } catch(err){
    console.error(err); toast('L’export Word a échoué. Sauvegarde ton travail en .json puis recharge la page.'); return null;
  }
}
$('#bWord').addEventListener('click', exportWord);
$('#bZip').addEventListener('click', async ()=>{
  const docx = await buildDocx(); if (!docx) return;
  const z = new JSZip(); const base = baseName();
  z.file(base+'.docx', docx);
  const used = new Set(); let miss = 0;
  for (const [i,t] of state.tasks.entries()){
    for (const p of t.proofs){
      const b = await getBlob(p.id); if (!b){ miss++; continue; }
      let name = p.name.replace(/[\\/:*?"<>|]/g,'_'), path = `Pieces_justificatives/Tache_${i+1}/${name}`, k = 2;
      while (used.has(path)){ path = `Pieces_justificatives/Tache_${i+1}/${name.replace(/(\.[^.]*)?$/, `_${k++}$1`)}`; }
      used.add(path); z.file(path, b);
    }
  }
  if (miss) toast(`${miss} pièce(s) introuvable(s) sur cet appareil.`);
  saveFile(base+'.zip', await z.generateAsync({type:'blob'}));
});

function renderAll(){ renderIdent(); renderTasks(); renderMap(); }
renderAll();
</script>
